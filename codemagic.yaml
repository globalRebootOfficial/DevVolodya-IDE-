workflows:
  android-debug:
    name: DevVolodya IDE - Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Make Gradle wrapper executable
        script: chmod +x ./gradlew
      - name: Build debug APK
        script: ./gradlew --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - dan4ik.pro.official@gmail.com
        notify:
          success: false
          failure: true
